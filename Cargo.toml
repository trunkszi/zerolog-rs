[package]
name = "zerolog-rs"
version = "0.1.1"
edition = "2024"
authors = ["Nathan Shea <itzrustz@gmail.com>"]
description = "High-performance lock-free structured logging with sub-30ns hot-path latency"
license = "MIT"
repository = "https://github.com/trunkszi/zerolog-rs"
readme = "README.md"
keywords = ["logging", "lock-free", "low-latency", "structured-logging", "async"]
categories = ["development-tools::debugging"]

[lib]
name = "zerolog"
path = "src/lib.rs"

[features]
default = ["buffer-2m"]
buffer-1m  = ["zerolog-core/buffer-1m"]
buffer-2m  = ["zerolog-core/buffer-2m"]
buffer-4m  = ["zerolog-core/buffer-4m"]
buffer-8m  = ["zerolog-core/buffer-8m"]
buffer-16m = ["zerolog-core/buffer-16m"]
buffer-32m = ["zerolog-core/buffer-32m"]
buffer-64m = ["zerolog-core/buffer-64m"]

[dependencies]
zerolog-core = { workspace = true }
zerolog-macros = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "zerolog_bench"
harness = false

[[bench]]
name = "latency_throughput"
harness = false

[[bench]]
name = "core_component_bench"
harness = false

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.bench]
lto = "fat"
codegen-units = 1

[workspace]
resolver = "3"
members = ["core", "macros"]

[workspace.dependencies]
zerolog-core = { path = "core", version = "0.1.1", default-features = false }
zerolog-macros = { path = "macros", version = "0.1.1" }

ryu = "1"
libc = "0.2"
proc-macro2 = "1"
syn = { version = "2", features = ["full"] }
quote = "1"
criterion = "0.8.2"
